- id: '1789846151394'
  alias: Brightness Slider - Set Value
  description: ''
  triggers:
  - trigger: state
    entity_id: input_number.light_brightness
  conditions:
  - condition: state
    entity_id: binary_sensor.someone_home
    state: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id: "{{ expand(label_entities('auto_brightness'))\n   | selectattr('state',
        'eq', 'on')\n   | rejectattr('attributes.entity_id', 'defined')\n   | map(attribute='entity_id')\n
        \  | list }}\n"
    data:
      brightness: '{{ ((trigger.to_state.state | float) * 2.54) | int }}'
  mode: single
- id: '1789846602015'
  alias: Light On - Set Brightness
  description: ''
  triggers:
  - trigger: light.turned_on
    target:
      label_id: auto_brightness
    options:
      for: 00:00:00
      behavior: each
  actions:
  - action: light.turn_on
    target:
      entity_id: '{{ trigger.entity_id }}'
    data:
      brightness_pct: '{{ states(''input_number.light_brightness'') }}'
  mode: parallel
  max: 30
- id: '1789846848389'
  alias: Home Presence - Power On/Off
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.someone_home
    from:
    - 'off'
    to:
    - 'on'
  - trigger: state
    entity_id:
    - binary_sensor.someone_home
    from:
    - 'on'
    to:
    - 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.someone_home
        state:
        - 'on'
      sequence:
      - action: script.power_on
        metadata: {}
        data: {}
    - conditions:
      - condition: state
        entity_id: binary_sensor.someone_home
        state:
        - 'off'
      sequence:
      - action: script.power_off
        metadata: {}
        data: {}
  mode: single
- id: '1790060442793'
  alias: Dashboard - Turn On/Off
  description: ''
  triggers:
  - trigger: time
    at: 07:00:00
    id: Turn On
  - trigger: time
    at: '23:00:00'
    id: Turn Off
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Turn On
      sequence:
      - action: switch.turn_on
        metadata: {}
        target:
          entity_id: switch.dashboard
        data: {}
    - conditions:
      - condition: trigger
        id:
        - Turn Off
      sequence:
      - action: switch.turn_off
        metadata: {}
        target:
          entity_id: switch.dashboard
        data: {}
  mode: single
- id: '1790078521836'
  alias: Guest Mode - Reset
  description: ''
  triggers:
  - trigger: time
    at: 04:00:00
  conditions: []
  actions:
  - action: input_boolean.turn_off
    metadata: {}
    target:
      entity_id: input_boolean.guest_mode
    data: {}
  mode: single
- id: '1790146871074'
  alias: Light Brightness - Set Value
  description: ''
  triggers:
  - trigger: time
    at: 08:00:00
    id: '15'
  - trigger: time
    at: '10:00:00'
    id: '80'
  - trigger: time
    at: '12:00:00'
    id: '100'
  - trigger: time
    at: '20:00:00'
    id: '15'
  conditions: []
  actions:
  - action: input_number.set_value
    metadata: {}
    target:
      entity_id: input_number.light_brightness
    data:
      value: '{{ trigger.id | int }}'
  mode: single
- id: '1790241315000'
  alias: Motion Detected - Kitchen & Hallway Lights
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.motion_detected
    from:
    - 'off'
    to:
    - 'on'
    id: Motion Detected
  - trigger: state
    entity_id:
    - binary_sensor.motion_detected
    from:
    - 'on'
    to:
    - 'off'
    id: Motion Cleared
  conditions:
  - condition: time
    after: 08:00:00
    before: '20:00:00'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Motion Detected
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.kitchen_lights
          - light.hallway_lights
    - conditions:
      - condition: trigger
        id:
        - Motion Cleared
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.kitchen_lights
          - light.hallway_lights
  mode: single
