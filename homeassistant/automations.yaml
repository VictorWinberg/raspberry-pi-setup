- id: '1789846151394'
  alias: Brightness Slider - Set Value
  description: ''
  triggers:
  - trigger: state
    entity_id: input_number.light_brightness
  conditions:
  - condition: state
    entity_id: binary_sensor.someone_home
    state: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id: "{{ expand(label_entities('auto_brightness'))\n   | selectattr('state',
        'eq', 'on')\n   | rejectattr('attributes.entity_id', 'defined')\n   | map(attribute='entity_id')\n
        \  | list }}\n"
    data:
      brightness: '{{ ((trigger.to_state.state | float) * 2.54) | int }}'
  mode: single
- id: '1789846602015'
  alias: Light On - Set Brightness
  description: ''
  triggers:
  - trigger: light.turned_on
    target:
      label_id: auto_brightness
    options:
      for: 00:00:00
      behavior: each
  actions:
  - action: light.turn_on
    target:
      entity_id: '{{ trigger.entity_id }}'
    data:
      brightness_pct: '{{ states(''input_number.light_brightness'') }}'
  mode: parallel
  max: 30
- id: '1789846848389'
  alias: Home Presence - Power On/Off
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.someone_home
    from:
    - 'off'
    to:
    - 'on'
  - trigger: state
    entity_id:
    - binary_sensor.someone_home
    from:
    - 'on'
    to:
    - 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.someone_home
        state:
        - 'on'
      sequence:
      - action: script.power_on
        metadata: {}
        data: {}
    - conditions:
      - condition: state
        entity_id: binary_sensor.someone_home
        state:
        - 'off'
      sequence:
      - action: script.power_off
        metadata: {}
        data: {}
  mode: single
- id: '1790060442793'
  alias: Dashboard - Turn On/Off
  description: ''
  triggers:
  - trigger: time
    at: 07:00:00
    id: Turn On
  - trigger: time
    at: '23:00:00'
    id: Turn Off
  conditions:
  - condition: state
    entity_id: binary_sensor.someone_home
    state:
    - 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Turn On
      sequence:
      - action: switch.turn_on
        metadata: {}
        target:
          entity_id: switch.dashboard
        data: {}
    - conditions:
      - condition: trigger
        id:
        - Turn Off
      sequence:
      - action: switch.turn_off
        metadata: {}
        target:
          entity_id: switch.dashboard
        data: {}
  mode: single
- id: '1790078521836'
  alias: Guest Mode - Reset
  description: ''
  triggers:
  - trigger: time
    at: 04:00:00
  conditions: []
  actions:
  - action: input_boolean.turn_off
    metadata: {}
    target:
      entity_id: input_boolean.guest_mode
    data: {}
  mode: single
- id: '1790146871074'
  alias: Light Brightness - Set Value
  description: ''
  triggers:
  - trigger: time
    at: 08:00:00
    id: '15'
  - trigger: time
    at: '10:00:00'
    id: '80'
  - trigger: time
    at: '12:00:00'
    id: '100'
  - trigger: time
    at: '20:00:00'
    id: '15'
  conditions: []
  actions:
  - action: input_number.set_value
    metadata: {}
    target:
      entity_id: input_number.light_brightness
    data:
      value: '{{ trigger.id | int }}'
  mode: single
- id: '1790241315000'
  alias: Motion Detected - Kitchen & Hallway Lights
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.motion_detected
    from:
    - 'off'
    to:
    - 'on'
    id: Motion Detected
  - trigger: state
    entity_id:
    - binary_sensor.motion_detected
    from:
    - 'on'
    to:
    - 'off'
    id: Motion Cleared
  conditions:
  - condition: time
    after: 08:00:00
    before: '20:00:00'
  - condition: state
    entity_id: binary_sensor.someone_home
    state:
    - 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Motion Detected
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.kitchen_lights
          - light.hallway_lights
    - conditions:
      - condition: trigger
        id:
        - Motion Cleared
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.kitchen_lights
          - light.hallway_lights
  mode: single
- id: '1790305344000'
  alias: Symfonisk Sound Remote - Button Actions
  description: Control Kasinot media player from Symfonisk remote
  triggers:
  - trigger: event.received
    target:
      entity_id: event.symfonisk_sound_remote_action
    options:
      event_type:
      - toggle
    id: toggle
  - trigger: event.received
    target:
      entity_id: event.symfonisk_sound_remote_action
    options:
      event_type:
      - track_previous
    id: previous
  - trigger: event.received
    target:
      entity_id: event.symfonisk_sound_remote_action
    options:
      event_type:
      - track_next
    id: next
  - trigger: event.received
    target:
      entity_id: event.symfonisk_sound_remote_action
    options:
      event_type:
      - volume_up
    id: up
  - trigger: event.received
    target:
      entity_id: event.symfonisk_sound_remote_action
    options:
      event_type:
      - volume_down
    id: down
  - trigger: event.received
    target:
      entity_id: event.symfonisk_sound_remote_action
    options:
      event_type:
      - dots_1_initial_press
    id: dot_1
  - trigger: event.received
    target:
      entity_id: event.symfonisk_sound_remote_action
    options:
      event_type:
      - dots_2_initial_press
    id: dot_2
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: toggle
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: media_player.kasinot
            state: 'off'
          sequence:
          - action: media_player.play_media
            target:
              entity_id: media_player.kasinot
            data:
              media_content_id: https://live1.sr.se/p4malm-mp3-96
              media_content_type: music
        default:
        - action: media_player.media_play_pause
          target:
            entity_id: media_player.kasinot
    - conditions:
      - condition: trigger
        id: previous
      sequence:
      - action: media_player.media_previous_track
        target:
          entity_id: media_player.kasinot
    - conditions:
      - condition: trigger
        id: next
      sequence:
      - action: media_player.media_next_track
        target:
          entity_id: media_player.kasinot
    - conditions:
      - condition: trigger
        id: up
      sequence:
      - action: media_player.volume_up
        target:
          entity_id: media_player.kasinot
    - conditions:
      - condition: trigger
        id: down
      sequence:
      - action: media_player.volume_down
        target:
          entity_id: media_player.kasinot
    - conditions:
      - condition: trigger
        id: dot_1
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.light_brightness
        data:
          value: '{{ max(0, states(''input_number.light_brightness'') | float - 20)
            }}'
    - conditions:
      - condition: trigger
        id: dot_2
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.light_brightness
        data:
          value: '{{ min(100, states(''input_number.light_brightness'') | float +
            20) }}'
  mode: single
