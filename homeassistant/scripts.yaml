power_off:
  sequence:
  - action: light.turn_off
    metadata: {}
    target:
      entity_id:
      - light.bedroom_lights
      - light.dining_lights
      - light.hallway_lights
      - light.tv_ambient
      - light.living_room
      - light.kitchen_lights
    data: {}
    continue_on_error: true
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id:
      - switch.living_room_plug
      - switch.window_plug
      - switch.bed_strip
      - switch.dashboard
      - switch.office
    data: {}
    continue_on_error: true
  - action: media_player.media_stop
    metadata: {}
    target:
      device_id:
      - 2563d9bad4bdc09071559aa2a8e47b91
      - 97392862ca74fadba17679987c00106a
      - ae91bcc35b18ee823421b141ab68b2f6
      - 1e2d746f6f467df9d8b8cb308b2e4f32
      - 55a2c74a132465a3804a3f7ae6759d90
    data: {}
    continue_on_error: true
  - action: media_player.turn_off
    metadata: {}
    target:
      entity_id:
      - media_player.speakers
      - media_player.mio
    data: {}
  alias: Power Off
  description: ''
power_on:
  sequence:
  - action: light.turn_on
    metadata: {}
    target:
      entity_id:
      - light.hallway_door
      - light.hallway_spots
    data: {}
    continue_on_error: true
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id:
      - switch.living_room_plug
      - switch.dashboard
    data: {}
    continue_on_error: true
  alias: Power On
  description: ''
favorite_song:
  alias: Favorite song
  description: Add the currently playing Spotify track to Music Assistant favorites
    on the active home speaker (from Spotify Connect source).
  icon: mdi:heart
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: media_player.spotify_victor
        state: playing
      - condition: state
        entity_id: media_player.spotify_victor
        attribute: source
        state: Kasinot
      sequence:
      - action: button.press
        target:
          entity_id: button.kasinot_favorite_current_song
    - conditions:
      - condition: state
        entity_id: media_player.spotify_victor
        state: playing
      - condition: state
        entity_id: media_player.spotify_victor
        attribute: source
        state: Speakers
      sequence:
      - action: button.press
        target:
          entity_id: button.speakers_favorite_current_song
    - conditions:
      - condition: state
        entity_id: media_player.spotify_victor
        state: playing
      - condition: state
        entity_id: media_player.spotify_victor
        attribute: source
        state: Bali
      sequence:
      - action: button.press
        target:
          entity_id: button.bali_favorite_current_song
    - conditions:
      - condition: state
        entity_id: media_player.spotify_victor
        state: playing
      - condition: state
        entity_id: media_player.spotify_victor
        attribute: source
        state: Rey
      sequence:
      - action: button.press
        target:
          entity_id: button.rey_favorite_current_song
    - conditions:
      - condition: state
        entity_id: media_player.spotify_victor
        state: playing
      - condition: state
        entity_id: media_player.spotify_victor
        attribute: source
        state: Rio
      sequence:
      - action: button.press
        target:
          entity_id: button.rio_favorite_current_song
    - conditions:
      - condition: state
        entity_id: media_player.spotify_victor
        state: playing
      - condition: state
        entity_id: media_player.spotify_victor
        attribute: source
        state: Mio Cast
      sequence:
      - action: button.press
        target:
          entity_id: button.mio_cast_favorite_current_song
    default:
    - action: persistent_notification.create
      data:
        title: Favorite song
        message: 'No Spotify playback on a home speaker (source: {{ state_attr(''media_player.spotify_victor'',
          ''source'') | default(''none'') }}).'
