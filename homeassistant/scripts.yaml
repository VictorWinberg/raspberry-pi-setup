  - action: light.turn_on
    metadata: {}
    target:
      entity_id:
      - light.hallway_door
      - light.hallway_spots
    data: {}
    continue_on_error: true
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id:
      - switch.living_room_plug
      - switch.dashboard
    data: {}
