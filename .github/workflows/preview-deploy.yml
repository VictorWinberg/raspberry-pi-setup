name: Preview - Deploy

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      KNOWN_HOSTS:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ inputs.app }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Resolve preview image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=${IMAGE}:${{ inputs.image_tag }}" >> "$GITHUB_ENV"

      - uses: shimataro/ssh-key-action@v2.8.1
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Deploy preview to Pi
        run: |
          OUTPUT=$(ssh gha@codies.se \
            "/opt/stacks/previews/scripts/deploy.sh ${{ inputs.app }} ${{ github.event.pull_request.number }} ${{ env.IMAGE }}")
          echo "$OUTPUT"
          echo "PREVIEW_URL=$(echo "$OUTPUT" | grep '^PREVIEW_URL=' | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: Build comment metadata
        run: |
          echo "TIMESTAMP=$(TZ=Europe/Stockholm date '+%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"
          echo "CITY=$(echo "$PREVIEW_URL" | sed -E 's|https?://([^./]+)\..*|\1|')" >> "$GITHUB_ENV"
          echo "ENV_SLUG=$(echo '${{ github.repository }}' | tr '/' '-')--${{ github.head_ref }}" >> "$GITHUB_ENV"

      - uses: marocchino/sticky-pull-request-comment@v2.9.4
        if: github.event.action != 'synchronize'
        with:
          header: test-env
          append: true
          message: |
            ## QA Test Environment
            _[${{ env.ENV_SLUG }}](${{ env.PREVIEW_URL }})_

            Environment has been created!
            Please visit [${{ env.CITY }}](${{ env.PREVIEW_URL }}).

            deploy ${{ env.TIMESTAMP }}

      - uses: marocchino/sticky-pull-request-comment@v2.9.4
        if: github.event.action == 'synchronize'
        with:
          header: test-env
          append: true
          message: redeploy ${{ env.TIMESTAMP }}
