name: Preview - Remove

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      KNOWN_HOSTS:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  remove-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: shimataro/ssh-key-action@v2.8.1
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Remove preview from Pi
        run: |
          ssh gha@codies.se \
            "/opt/stacks/previews/scripts/remove.sh ${{ inputs.app }} ${{ github.event.pull_request.number }}"

      - uses: marocchino/sticky-pull-request-comment@v2.9.4
        with:
          header: test-env
          append: true
          message: _Environment has been shut down._
