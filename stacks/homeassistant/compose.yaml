services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /srv/data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Europe/Stockholm
    labels:
      - "dev.dozzle.url=https://home.codies.se"
