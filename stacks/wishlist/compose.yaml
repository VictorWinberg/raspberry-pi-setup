services:
  wishlist:
    image: ghcr.io/annieleonia/wishlist:latest
    container_name: wishlist
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wishlist.rule=Host(`wish.codies.se`)"
      - "traefik.http.routers.wishlist.entrypoints=websecure"
      - "traefik.http.routers.wishlist.tls.certresolver=letsencrypt"
      - "traefik.http.services.wishlist.loadbalancer.server.port=3000"
      - "dev.dozzle.url=https://wish.codies.se"

networks:
  proxy:
    external: true
